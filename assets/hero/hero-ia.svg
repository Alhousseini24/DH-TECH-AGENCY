<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="0.6" stop-color="#0c0c14"/>
      <stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.2" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#f5a315" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f5a315" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg3)"/>
  <rect width="1600" height="900" fill="url(#glow3)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>
  <!-- neural network -->
  <g stroke="#f5a315" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="1150" y1="200" x2="1230" y2="350"/><line x1="1150" y1="200" x2="1280" y2="330"/>
    <line x1="1150" y1="200" x2="1200" y2="480"/><line x1="1230" y1="350" x2="1390" y2="300"/>
    <line x1="1280" y1="330" x2="1390" y2="300"/><line x1="1230" y1="350" x2="1200" y2="480"/>
    <line x1="1280" y1="330" x2="1200" y2="480"/><line x1="1390" y1="300" x2="1200" y2="480"/>
    <line x1="1390" y1="300" x2="1450" y2="450"/><line x1="1200" y2="480" x2="1450" y2="450"/>
    <line x1="1230" y1="350" x2="1450" y2="450"/>
  </g>
  <g fill="#f5a315">
    <circle cx="1150" cy="200" r="14"/>
    <circle cx="1230" cy="350" r="10" fill-opacity="0.85"/>
    <circle cx="1280" cy="330" r="10" fill-opacity="0.85"/>
    <circle cx="1200" cy="480" r="10" fill-opacity="0.85"/>
    <circle cx="1390" cy="300" r="12"/>
    <circle cx="1450" cy="450" r="14"/>
  </g>
  <!-- robot head -->
  <g transform="translate(300,260)">
    <rect width="180" height="140" rx="24" fill="#0d0d12" stroke="#f5a315" stroke-opacity="0.5" stroke-width="3"/>
    <rect x="30" y="34" width="50" height="22" rx="11" fill="#f5a315" fill-opacity="0.9"/>
    <rect x="100" y="34" width="50" height="22" rx="11" fill="#f5a315" fill-opacity="0.9"/>
    <rect x="40" y="86" width="100" height="12" rx="6" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="20" y="-26" width="12" height="40" rx="6" fill="#f5a315" fill-opacity="0.6"/>
    <rect x="148" y="-26" width="12" height="40" rx="6" fill="#f5a315" fill-opacity="0.6"/>
  </g>
  <text x="1500" y="760" font-family="monospace" font-size="16" fill="#f5a315" fill-opacity="0.5">AI</text>
