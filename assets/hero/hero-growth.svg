<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050508"/>
      <stop offset="0.6" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#1a1204"/>
    </linearGradient>
    <radialGradient id="glow6" cx="0.25" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#f5a315" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f5a315" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg6)"/>
  <rect width="1600" height="900" fill="url(#glow6)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>
  <!-- rocket -->
  <g transform="translate(1180,160)">
    <ellipse cx="38" cy="150" rx="34" ry="10" fill="#f5a315" fill-opacity="0.25"/>
    <path d="M48 20 C60 58 66 92 66 130 L66 150 L10 150 L10 130 C10 92 16 58 28 20 Z" fill="#0d0d12" stroke="#f5a315" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="38" cy="60" r="14" fill="none" stroke="#f5a315" stroke-width="3"/>
    <rect x="30" y="95" width="16" height="8" rx="4" fill="#f5a315" fill-opacity="0.8"/>
    <path d="M10 150 L-6 190 L18 190 Z" fill="#f5a315" fill-opacity="0.5"/>
    <path d="M66 150 L82 190 L58 190 Z" fill="#f5a315" fill-opacity="0.5"/>
    <path d="M38 170 L38 200" stroke="#f5a315" stroke-opacity="0.6" stroke-width="3"/>
    <path d="M38 210 L38 240" stroke="#f5a315" stroke-opacity="0.3" stroke-width="3"/>
  </g>
  <!-- orbit rings -->
  <g fill="none" stroke="#f5a315" stroke-opacity="0.25" stroke-width="2">
    <ellipse cx="300" cy="300" rx="180" ry="70"/>
    <ellipse cx="300" cy="300" rx="230" ry="95"/>
  </g>
  <circle cx="300" cy="300" r="14" fill="#f5a315"/>
  <circle cx="120" cy="300" r="6" fill="#f5a315" fill-opacity="0.7"/>
  <circle cx="530" cy="300" r="6" fill="#f5a315" fill-opacity="0.7"/>
  <!-- growth arrow -->
  <g stroke="#f5a315" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M500 640 L600 560 L680 580 L820 460"/>
  </g>
  <!-- connected devices -->
  <rect x="180" y="560" width="90" height="60" rx="10" fill="#0d0d12" stroke="#f5a315" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="860" y="560" width="90" height="60" rx="10" fill="#0d0d12" stroke="#f5a315" stroke-opacity="0.4" stroke-width="2"/>
  <g stroke="#f5a315" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M270 590 L500 640 L820 590"/>
  </g>
  <text x="1500" y="760" font-family="monospace" font-size="16" fill="#f5a315" fill-opacity="0.5">GO</text>
